services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: crud
      POSTGRES_USER: crud
      POSTGRES_PASSWORD: crud_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U crud -d crud",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .

    environment:
      DATABASE_URL: postgresql+asyncpg://crud:crud_password@db:5432/crud
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: