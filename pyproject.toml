[project]
name = "crud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5,<1.19",
    "asyncpg>=0.31.0,<0.32",
    "celery>=5.6.3,<5.7",
    "flower>=2.0,<3",
    "fastapi[standard]>=0.140.0",
    "minio>=7.2,<8",
    "pwdlib[argon2]>=0.3,<0.4",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.13,<3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
